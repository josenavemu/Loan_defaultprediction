name: Loan Default Prediction - Lab 13 Monitoring CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitoring-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Lab 13 monitoring tests
        run: |
          python -m unittest discover -s tests -p "test_lab13.py" -v
